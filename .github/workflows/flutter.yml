name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'assets/screenshots/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'assets/screenshots/**'

jobs:
  # ── Job 1: 格式與靜態分析（與 test shards 並行）────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Cache build_runner outputs
        uses: actions/cache@v6
        with:
          path: |
            .dart_tool/build/
            .dart_tool/hooks_runner/shared/
            lib/**/*.drift.dart
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'lib/data/database/tables/**', 'lib/domain/models/**') }}
          restore-keys: build-runner-${{ runner.os }}-

      - name: Generate code (Drift)
        # sqlite3 native-asset hook 會從 GitHub Releases 下載 libsqlite3——
        # 2026-08-12 兩個 run 因 CDN 中途斷線而紅(與程式碼無關,見
        # intraday_alert_heartbeat_test 的失敗訊息「Building assets for
        # package:sqlite3 failed」)。產物已入上方快取,正常不會走到下載;
        # 走到時給 3 次機會。
        run: |
          for i in 1 2 3; do
            dart run build_runner build --delete-conflicting-outputs && exit 0
            echo "build_runner attempt $i failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos lib/

  # ── Job 2: 測試 shards（3 個並行）──────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Cache build_runner outputs
        uses: actions/cache@v6
        with:
          path: |
            .dart_tool/build/
            .dart_tool/hooks_runner/shared/
            lib/**/*.drift.dart
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'lib/data/database/tables/**', 'lib/domain/models/**') }}
          restore-keys: build-runner-${{ runner.os }}-

      - name: Generate code (Drift)
        # sqlite3 native-asset hook 會從 GitHub Releases 下載 libsqlite3——
        # 2026-08-12 兩個 run 因 CDN 中途斷線而紅(與程式碼無關,見
        # intraday_alert_heartbeat_test 的失敗訊息「Building assets for
        # package:sqlite3 failed」)。產物已入上方快取,正常不會走到下載;
        # 走到時給 3 次機會。
        run: |
          for i in 1 2 3; do
            dart run build_runner build --delete-conflicting-outputs && exit 0
            echo "build_runner attempt $i failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Run tests
        run: flutter test --coverage --exclude-tags golden --total-shards=3 --shard-index=${{ matrix.shard }}

      # 各 shard 分別上傳 partial report，Codecov 後端依 commit 自動合併；
      # 生成碼排除由 repo 根目錄 codecov.yml 的 ignore 規則處理。
      #
      # timeout + continue-on-error：coverage 上傳是非關鍵步驟，不得有能力弄倒 CI。
      # 2026-07-25 實例：action 下載 CLI 後在 gpg 匯入金鑰卡死 236s（平常 3s），
      # 吃光 job 10 分鐘餘裕 → 整個 run 被取消（測試其實已全過）。
      # fail_ci_if_error 只擋「錯誤」擋不住「卡死」，故改以步驟級逾時設上限。
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        timeout-minutes: 3
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: shard-${{ matrix.shard }}
          fail_ci_if_error: false
