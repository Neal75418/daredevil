name: Flutter CI

on:
  workflow_dispatch:
  # release.yml 以此為發佈閘門（格式、分析、測試全過才建置）
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'assets/screenshots/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'assets/screenshots/**'

jobs:
  # ── Job 1: 格式與靜態分析（與 test shards 並行）────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Cache build_runner outputs
        uses: actions/cache@v6
        with:
          path: |
            .dart_tool/build/
            .dart_tool/hooks_runner/shared/
            lib/**/*.drift.dart
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'lib/data/database/tables/**', 'lib/domain/models/**') }}
          restore-keys: build-runner-${{ runner.os }}-

      - name: Generate code (Drift)
        # sqlite3 native-asset hook 會從 GitHub Releases 下載 libsqlite3——
        # 2026-08-12 兩個 run 因 CDN 中途斷線而紅(與程式碼無關,見
        # intraday_alert_heartbeat_test 的失敗訊息「Building assets for
        # package:sqlite3 failed」)。產物已入上方快取,正常不會走到下載;
        # 走到時給 3 次機會。
        run: |
          for i in 1 2 3; do
            dart run build_runner build --delete-conflicting-outputs && exit 0
            echo "build_runner attempt $i failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # 整個專案（lib/test/tool/bin），info 也算失敗：只查 lib/、放過 info 時，
      # test/ 與 tool/ 累積到 86 個問題，其中一個是只取值不斷言的空轉測試
      - name: Analyze project source
        run: flutter analyze

  # ── Job 2: 測試 shards（5 個並行）──────────────────────────────────
  test:
    runs-on: ubuntu-latest
    # 10 → 15（2026-09-25）：正常 run 已用 456–550s（上限的 76–92%）；
    # Flutter SDK 快取閒置 7 天即被清，再多 ~40s 下載就超時被取消（測試其實全過）。
    # 卡死防護不靠這裡：Codecov 步驟另有 3 分鐘的步驟級 timeout。
    # 2026-11-05：3 個 shard 時最慢的 shard 測試步驟 12m34s、整個 job 15m02s，收尾
    # 步驟被逾時取消（測試其實全過）。只把 shard 加到 5 個幾乎沒用（最慢 12m12s）：
    # 見下方「Run tests」，改成依測試檔分 shard。上限維持 15 分鐘，作為卡死時的上界。
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Cache build_runner outputs
        uses: actions/cache@v6
        with:
          path: |
            .dart_tool/build/
            .dart_tool/hooks_runner/shared/
            lib/**/*.drift.dart
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'lib/data/database/tables/**', 'lib/domain/models/**') }}
          restore-keys: build-runner-${{ runner.os }}-

      - name: Generate code (Drift)
        # sqlite3 native-asset hook 會從 GitHub Releases 下載 libsqlite3——
        # 2026-08-12 兩個 run 因 CDN 中途斷線而紅(與程式碼無關,見
        # intraday_alert_heartbeat_test 的失敗訊息「Building assets for
        # package:sqlite3 failed」)。產物已入上方快取,正常不會走到下載;
        # 走到時給 3 次機會。
        run: |
          for i in 1 2 3; do
            dart run build_runner build --delete-conflicting-outputs && exit 0
            echo "build_runner attempt $i failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      # 依測試檔分 shard，不用 flutter test 的 --total-shards：後者在「每個測試檔內」
      # 切測試（test_core 0.6.12 runner.dart 的 _shardSuite），每個 shard 仍要編譯、
      # 載入全部測試檔，加 shard 幾乎省不了時間。依路徑排序後輪流分配檔案，每個
      # shard 只編譯自己的檔案（本機冷快取、同為約五分之一的測試：依檔案 40s、
      # 依 --total-shards 122s）。測試路徑沒有空白，可直接拆成參數。
      - name: Run tests
        run: |
          files=$(find test -name '*_test.dart' | sort | awk -v n=${{ strategy.job-total }} -v i=${{ matrix.shard }} '(NR - 1) % n == i')
          [ -n "$files" ] || { echo "shard ${{ matrix.shard }}: no test files"; exit 1; }
          echo "shard ${{ matrix.shard }}: $(echo "$files" | wc -l) test files"
          flutter test --coverage --exclude-tags golden $files

      # 各 shard 分別上傳 partial report，Codecov 後端依 commit 自動合併；
      # 生成碼排除由 repo 根目錄 codecov.yml 的 ignore 規則處理。
      #
      # timeout + continue-on-error：coverage 上傳是非關鍵步驟，不得有能力弄倒 CI。
      # 2026-07-25 實例：action 下載 CLI 後在 gpg 匯入金鑰卡死 236s（平常 3s），
      # 吃光 job 10 分鐘餘裕 → 整個 run 被取消（測試其實已全過）。
      # fail_ci_if_error 只擋「錯誤」擋不住「卡死」，故改以步驟級逾時設上限。
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        timeout-minutes: 3
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: shard-${{ matrix.shard }}
          fail_ci_if_error: false

  # ── Job 3: 撥 +90 天的測試 shards（與 Job 2 並行）────────────────────
  # 把 lib／tool 的「現在」往後撥 90 天跑測試（範圍同 Job 2；scripts/test_time_shift.sh，
  # 見 DeviceTime），提前抓「過了某天才會紅」的時間炸彈：服務從現在往回推窗口、
  # 測試卻用固定日期資料。這裡紅不一定是這次改動造成的。
  #
  # 獨立成一個 job、不在 Job 2 的 matrix 加「撥幾天」：Job 2 依 strategy.job-total
  # 分檔，多一個維度 job 總數就變兩倍、分檔算錯（有檔案沒被分到也不會報錯）。
  # 不上傳覆蓋率（Codecov 只收 Job 2 的 5 份）。
  test-time-shift:
    name: test (+90 days, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Cache build_runner outputs
        uses: actions/cache@v6
        with:
          path: |
            .dart_tool/build/
            .dart_tool/hooks_runner/shared/
            lib/**/*.drift.dart
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'lib/data/database/tables/**', 'lib/domain/models/**') }}
          restore-keys: build-runner-${{ runner.os }}-

      - name: Generate code (Drift)
        # 重試理由同 Job 2
        run: |
          for i in 1 2 3; do
            dart run build_runner build --delete-conflicting-outputs && exit 0
            echo "build_runner attempt $i failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      # 分檔方式同 Job 2
      - name: Run tests (+90 days)
        id: tests
        run: |
          files=$(find test -name '*_test.dart' | sort | awk -v n=${{ strategy.job-total }} -v i=${{ matrix.shard }} '(NR - 1) % n == i')
          [ -n "$files" ] || { echo "shard ${{ matrix.shard }}: no test files"; exit 1; }
          echo "shard ${{ matrix.shard }}: $(echo "$files" | wc -l) test files"
          scripts/test_time_shift.sh 90 --exclude-tags golden $files

      # 只在測試那一步失敗時說明（測試之前的下載、建置失敗時不寫；測試步驟裡面
      # 也可能下載失敗，文案提醒先排除）
      - name: Explain failure
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          {
            echo '### 撥 +90 天的測試紅了'
            echo '多半代表有測試會在 90 天內開始紅（時間炸彈），不一定是這次改動造成的。'
            echo '先看一般測試那組（`test (N)`）：同一個測試也紅的話，是一般失敗、不是時間炸彈。'
            echo '本機重現（CI 是 UTC）：`TZ=UTC scripts/test_time_shift.sh 90 <紅的測試檔>`。'
            echo '本機重現不出來時，先看失敗訊息是不是下載失敗（例如 `Building assets for package:sqlite3 failed`）或偶發失敗的測試，重跑那個 job 即可。'
            echo '常見原因：測試用固定日期資料、程式從「現在」往回推窗口 → 注入固定時鐘或改相對日期；'
            echo '測試自己讀真實 `DateTime.now()` 算預期 → 改讀 `DeviceTime.now()`。'
          } >> "$GITHUB_STEP_SUMMARY"
