name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 發佈閘門：與 push/PR 相同的 CI（格式、分析、測試）全過才建置。
  # 原本推 tag 就直接建置，未過測試的 commit 也能發佈出去。
  ci:
    name: CI gate
    uses: ./.github/workflows/flutter.yml
    secrets: inherit

  build-android:
    name: Build Android APK
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Cache build_runner outputs
        uses: actions/cache@v6
        with:
          path: |
            .dart_tool/build/
            .dart_tool/hooks_runner/shared/
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'lib/**/*.dart') }}
          restore-keys: build-runner-${{ runner.os }}-

      - name: Generate code
        # sqlite3 native-asset hook 下載重試(同 flutter.yml,2026-08-12 CDN 斷線前科)
        run: |
          for i in 1 2 3; do
            dart run build_runner build --delete-conflicting-outputs && exit 0
            echo "build_runner attempt $i failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      # 缺 secrets 就失敗：gradle 在 CI 上沒有 key.properties 時也會擋下
      # （build.gradle.kts 檔尾），這裡先給明確訊息。設定方式見 RELEASE.md。
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::缺 secret ANDROID_${v}（見 RELEASE.md「CI 簽署」）"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Build App Bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Rename artifacts
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          VERSION=${TAG_REF#refs/tags/v}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/daredevil-${VERSION}.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/daredevil-${VERSION}.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab

      # --obfuscate 後 Sentry 上的 stack trace 要靠這份符號檔還原；
      # runner 建完即銷毀，不上傳就永久遺失。
      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-info
          path: build/debug-info
          retention-days: 90

  build-ios:
    name: Build iOS (No Signing)
    needs: ci
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Cache build_runner outputs
        uses: actions/cache@v6
        with:
          path: |
            .dart_tool/build/
            .dart_tool/hooks_runner/shared/
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'lib/**/*.dart') }}
          restore-keys: build-runner-${{ runner.os }}-

      - name: Generate code
        # sqlite3 native-asset hook 下載重試(同 flutter.yml,2026-08-12 CDN 斷線前科)
        run: |
          for i in 1 2 3; do
            dart run build_runner build --delete-conflicting-outputs && exit 0
            echo "build_runner attempt $i failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/debug-info --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Create IPA directory
        run: mkdir -p build/ios/ipa

      - name: Create Payload
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r build/ios/ipa/daredevil-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned
          path: build/ios/ipa/*.ipa

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: ios-debug-info
          path: build/debug-info
          retention-days: 90

  release:
    name: Create Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: artifacts/android

      - name: Download Android AAB
        uses: actions/download-artifact@v8
        with:
          name: android-aab
          path: artifacts/android

      - name: Download iOS
        uses: actions/download-artifact@v8
        with:
          name: ios-unsigned
          path: artifacts/ios

      - name: Get version from tag
        id: version
        env:
          TAG_REF: ${{ github.ref }}
        run: echo "VERSION=${TAG_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Daredevil ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          body: |
            ## Daredevil ${{ steps.version.outputs.VERSION }}

            ### Downloads
            - **Android APK**: 直接安裝 (需開啟未知來源)
            - **Android AAB**: 上傳至 Google Play Console
            - **iOS (unsigned)**: 需自行簽名或使用 TestFlight
          files: |
            artifacts/android/*.apk
            artifacts/android/*.aab
            artifacts/ios/*.ipa
          draft: false
          prerelease: false
