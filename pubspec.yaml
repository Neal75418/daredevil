name: daredevil
description: "Local-first post-market Taiwan stock scanner — scans the entire market after hours, surfacing only what changed."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.6.0+1

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

  # State Management
  flutter_riverpod: ^3.2.1

  # Annotations (給純 Dart code 用 @visibleForTesting / @immutable，
  # 避免 import package:flutter/foundation.dart 把 dart:ui 拉進 CLI graph)
  meta: ^1.16.0

  # Database
  drift: ^2.32.0
  drift_flutter: ^0.3.0

  # Network
  dio: ^5.9.2

  # RSS
  xml: ^6.5.0

  # Navigation
  go_router: ^17.1.0

  # URL Launcher
  url_launcher: ^6.3.1

  # Utils
  intl: ^0.20.1
  collection: ^1.19.1
  crypto: ^3.0.6

  # Preferences
  shared_preferences: ^2.3.5

  # Secure Storage (for API tokens)
  flutter_secure_storage: ^10.0.0

  # UI Animations & Effects
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Swipe Actions
  flutter_slidable: ^4.0.3

  # Charts
  fl_chart: ^1.1.1
  k_chart_plus: ^1.0.4

  # Calendar
  table_calendar: ^3.1.2

  # Localization
  easy_localization: ^3.0.7

  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # Background Tasks
  workmanager: ^0.9.0

  # Connectivity
  connectivity_plus: ^7.0.0

  # Crash Reporting & Observability
  sentry_flutter: ^9.15.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3

  # Lints
  flutter_lints: ^6.0.0

  # Code Generation (only Drift; freezed/json_serializable/riverpod codegen unused)
  build_runner:
  drift_dev: ^2.31.0

  # Testing
  mocktail: ^1.0.4

  # Tool scripts (tool/*.dart) 直連 SQLite 用
  sqlite3: ^3.0.0

  # App Icon Generation
  flutter_launcher_icons: ^0.14.3

  # Splash Screen
  flutter_native_splash: ^2.4.4

# Dependency overrides: flutter_riverpod 3.x 透過 riverpod 依賴 test 套件，與 build 工具鏈
# （analyzer/dart_style）版本衝突需 pin（見 riverpod#4364）。
dependency_overrides:
  analyzer: '>=10.0.0 <11.0.0'  # Pin to 10.x — dart_style 3.1.8 needs analyzer 11+
  dart_style: 3.1.5             # Pin exact — 3.1.8 requires BlockEnumBody from analyzer 11+
  intl: ^0.20.1                 # k_chart_plus 1.0.4 宣告 ^0.19，實際只用 NumberFormat（0.19→0.20 該 API 無變更）

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  # 深色線圖風格：adaptive 背景改用深色分層圖（與 iOS 全出血版一致），
  # 前景為線條＋端點透明層。全出血同尺度，圓形遮罩下仍完整（見遮罩驗證）。
  adaptive_icon_background: "assets/icons/app_icon_bg.png"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  # macOS 桌面：Big Sur 圓角本體＋留白已預烘進來源圖（generator 只縮放不加框）
  macos:
    generate: true
    image_path: "assets/icons/app_icon_macos.png"

# Native Splash Screen Configuration
# 極簡無縫：啟動底色直接對上 App 的淺/深背景（淺=白、深=Zinc900 #18181B，
# 見 app_theme.dart _backgroundLight/_backgroundDark），消除深色模式冷啟動白閃。
# 不放 logo（現代 LaunchScreen 應像 App 首屏而非載入頁）。
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#18181B"
  android_12:
    color: "#FFFFFF"
    color_dark: "#18181B"
    # Android 12+ 強制顯示 launcher icon；給深色圓底讓青/白線在兩種模式都可見
    icon_background_color: "#18181B"
    icon_background_color_dark: "#18181B"
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets
  assets:
    - assets/translations/
    # assets/icons/ 不列入 bundle：內含 launcher/splash 來源圖，為建置期輸入
    # （flutter_launcher_icons / native_splash 以檔案路徑讀取），runtime 無載入
    # Calibrated rule scores (generated by tool/recalibrate.dart, consumed
    # by Stage 5 runtime loader). Listed explicitly so the _candidate.json
    # review artifacts and *.tmp atomic-write stagings are NOT bundled.
    - assets/rule_scores_calibrated_short.json
    - assets/rule_scores_calibrated_long.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
